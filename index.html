
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED-DOT STUDIOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090909;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 7%;
      border-bottom: 1px solid #292929;
    }
    .brand { font-size: 18px; font-weight: 900; }
    .dot {
      display: inline-block;
      background: #ed1c24;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      margin-right: 8px;
    }
    main { padding: 90px 7%; }
    .tag { color: #ed1c24; letter-spacing: 3px; }
    h1 {
      font-size: clamp(42px, 9vw, 76px);
      line-height: 1;
    }
    .red { color: #ed1c24; }
    p { color: #bbbbbb; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 20px;
      background: #ed1c24;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 3px;
    }
    footer {
      padding: 25px 7%;
      color: #999999;
      border-top: 1px solid #292929;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>RED-DOT STUDIOS</div>
  </header>

  <main>
    <p class="tag">INDEPENDENT CREATIVE STUDIO</p>
    <h1>WE CREATE.<br>YOU FEEL.<br><span class="red">THE WORLD NOTICES.</span></h1>
    <p>
      Photography. Film. Design. Digital creativity.
      One studio, endless possibilities.
    </p>
    <a href="#contact">LET'S CREATE ↗</a>
  </main>

  <footer id="contact">
    © 2026 RED-DOT STUDIOS · NAIROBI, KENYA
  </footer>
</body>
</html>
